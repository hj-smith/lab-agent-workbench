<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#29261f">
<title>研发工作台 · 现场</title>
<style>
  :root {
    --ground: #f4f2ec; --surface: #fffefb; --surface-2: #f9f7f2; --ink: #29261f; --muted: #6b665c; --faint: #8f897c;
    --line: #e7e2d7; --line-strong: #d4cdbe; --tint: #efeae1; --charcoal: #29261f;
    --clay: #c96442; --clay-soft: #f6e8df; --clay-line: #ecd3c5; --clay-ink: #a14a2b;
    --good-bg: #e9f0df; --good-ink: #4f7d33; --bad-bg: #f8e5de; --bad-ink: #a0402c;
    font: 16px/1.55 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; color: var(--ink); background: var(--ground);
    font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--ground); }
  body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  button, input, textarea, select { font: inherit; color: inherit; }
  a { color: var(--clay-ink); }
  .top { position: sticky; top: 0; z-index: 5; background: var(--charcoal); color: #f4f2ec; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px; }
  .top b { font-size: 16px; letter-spacing: .03em; }
  .top .back { border: 0; background: none; color: #f4f2ec; font-size: 22px; line-height: 1; padding: 2px 8px 2px 0; }
  .top .grow { flex: 1; }
  .lib { display: flex; background: #1a1917; border-radius: 8px; padding: 3px; }
  .lib button { border: 0; background: none; color: #c9c3b6; border-radius: 6px; padding: 4px 10px; font-size: 13px; }
  .lib button.on { background: var(--surface); color: var(--ink); font-weight: 700; }
  main { padding: 14px 14px 0; display: flex; flex-direction: column; gap: 12px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 2px 2px 0; line-height: 1.4; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 2px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .item:active { background: var(--tint); }
  .item .main { flex: 1; min-width: 0; }
  .item .name { font-weight: 700; }
  .item .meta { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .arrow { color: var(--faint); font-size: 20px; }
  .tag { font-size: 12px; border-radius: 10px; padding: 1px 8px; background: var(--tint); color: var(--muted); white-space: nowrap; }
  .tag.now { background: var(--clay-soft); color: var(--clay-ink); }
  .tag.good { background: var(--good-bg); color: var(--good-ink); }
  .tag.bad { background: var(--bad-bg); color: var(--bad-ink); }
  .search { width: 100%; height: 44px; border: 1px solid var(--line-strong); border-radius: 12px; padding: 0 14px; background: var(--surface); }
  .section-title { font-size: 14px; font-weight: 700; color: var(--clay-ink); margin: 6px 2px -4px; }
  .row-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .row-card.done { border-color: #c9dcb5; }
  .row-head { display: flex; align-items: baseline; gap: 8px; }
  .row-head .label { font-weight: 700; flex: 1; }
  .row-head { flex-wrap: wrap; }
  .row-head .label { min-width: 6em; }
  .row-head .plan { color: var(--muted); font-size: 14px; white-space: normal; overflow-wrap: anywhere; }
  main, .row-card, .card { min-width: 0; max-width: 100%; }
  html, body { overflow-x: hidden; }
  .field { display: flex; align-items: center; gap: 8px; }
  .field .what { color: var(--muted); font-size: 13px; min-width: 52px; }
  .field input, .field textarea { flex: 1; min-width: 0; height: 48px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 12px; background: var(--surface-2); font-size: 18px; }
  .field textarea { height: auto; min-height: 48px; padding: 10px 12px; font-size: 15px; resize: vertical; }
  .field input:focus, .field textarea:focus, .search:focus { outline: none; border-color: var(--clay); box-shadow: 0 0 0 3px rgba(201, 100, 66, .15); background: var(--surface); }
  .field .unit { color: var(--muted); font-size: 14px; min-width: 22px; }
  .dev { font-size: 13px; }
  .dev:empty { display: none; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 16px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 12px; font-size: 15px; }
  .btn.primary { background: var(--clay); border-color: var(--clay); color: #fff; font-weight: 700; }
  .btn.block { width: 100%; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .options .btn { justify-content: flex-start; text-align: left; line-height: 1.45; padding: 10px 14px; }
  .evidence { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
  .segs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .segs button { flex: none; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 18px; padding: 6px 14px; font-size: 14px; }
  .segs button.on { background: var(--charcoal); border-color: var(--charcoal); color: #fff; }
  .status { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--charcoal); color: #fff; border-radius: 20px; padding: 7px 16px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
  .status.on { opacity: .94; }
  .empty { color: var(--muted); text-align: center; padding: 28px 10px; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabs a { flex: 1; text-align: center; padding: 9px 0 10px; text-decoration: none; color: var(--muted); font-size: 13px; position: relative; }
  .tabs a b { display: block; font-size: 16px; color: var(--ink); font-weight: 600; }
  .tabs a.on b, .tabs a.on { color: var(--clay-ink); }
  .tabs .badge { position: absolute; top: 6px; left: calc(50% + 18px); background: var(--clay); color: #fff; font-size: 11px; border-radius: 9px; padding: 0 6px; }
  .note { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0 2px; }
  .card textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 15px; background: var(--surface-2); resize: vertical; }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .photos:empty { display: none; }
  .photo { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--muted); font-size: 11px; }
  .photo img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: var(--tint); }
  .photo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/web/js/mobile.js"></script>
</body>
</html>
